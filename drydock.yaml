name: ochre          # init → project.json name; also the Postgres db/user and <name>.dested.com
kind: ssr
runtime: bun
port: 4080                 # container port; the task def injects it as PORT, which server/env.ts already reads
size: s
rootDir: apps/web
build: bun run build       # runs in apps/web after the root workspace install (needs Drydock's workspace fix)
start: bun run start       # cross-env NODE_ENV=production bun server.ts. No --env-file in start: prod env comes from ECS/SSM
database: true
prisma: true
predeploy: bunx prisma migrate deploy   # never Drydock's `db push --accept-data-loss` default
